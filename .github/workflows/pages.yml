# Builds and deploys the site to GitHub Pages.
#
# Runs on every push to master, every 30 minutes, and on demand. Each run
# first refreshes data/github.json (repositories and the latest commit)
# with this workflow's own token, so visitors never call the rate-limited
# GitHub API themselves, and events.ics, the calendar feed people
# subscribe to. The snapshot ships with the deployment; it is
# never committed, so the git history stays clean.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [master]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unit tests
        run: npm test

      - name: Snapshot GitHub data
        run: node tools/github-snapshot.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Calendar feed
        run: node tools/events-feed.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
